# Runs the dependency-free unit suite (test/run-all.js aggregates the
# per-file self-runners) on every PR and on pushes to main, so a green
# checkmark actually proves the tests ran - they were previously manual-only.
#
# NOTE: like pr-preview.yml, this workflow does not run for the PR that first
# introduces it (GitHub only trusts workflows it knows from main). It gates
# every subsequent PR.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/run-all.js
      # scripts/check-cache-bump.sh needs git history to diff against a base
      # ref, which is why it was never wired into test/run-all.js (see that
      # script's own header) - it was manual-only instead, which is how the
      # music-v341 drift (2026-08-21 to 2026-09-05, one commit touched a
      # CORE-precached file with no bump) reached main uncaught. A workflow
      # step is the right home: real git history via fetch-depth 0, no
      # change to the dependency-free unit runner.
      - name: cache-bump guard
        run: |
          BASE="${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "no usable base ref (first push on a new branch) - skipping"
            exit 0
          fi
          bash scripts/check-cache-bump.sh "$BASE"
